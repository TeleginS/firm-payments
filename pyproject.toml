[project]
name = "firm-payments"
version = "0.1.0"
description = "Bulk payment service: all-or-nothing payments between firms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
# An application, not a library: run from the source tree, don't build a wheel.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored submodule and agent tooling follow their own style.
extend-exclude = ["agent-orchestration", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
