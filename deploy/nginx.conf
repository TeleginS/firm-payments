# Load balancer in front of the app replicas, so the stack runs the way the brief
# describes: several instances sharing one database.
#
# Docker's DNS returns every replica of the `app` service, and nginx adds each address
# to the upstream when it starts. `docker compose up` restarts nginx when the replica
# count changes.

upstream app {
    server app:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Never resend a POST to another replica. A payment request that timed out
        # may have committed; retrying it is the client's call, safe once ADR 0003's
        # Idempotency-Key is implemented. (This is nginx's default since 1.9.13; stated for clarity.)
        proxy_next_upstream error timeout;
    }
}
